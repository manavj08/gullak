services:
  - type: web
    name: gullak-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "gullak-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://gullak-frontend.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://gullak-frontend.onrender.com"
      - key: TIME_ZONE
        value: "Asia/Kolkata"
      - key: PYTHON_VERSION
        value: "3.12.3"

  - type: web
    name: gullak-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://gullak-backend.onrender.com/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
